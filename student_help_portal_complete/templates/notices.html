{% extends "base.html" %}{% block content %}<h2>Student Notices</h2>{% for n in notices %}<div class="card p-3 mb-3"><span class="badge bg-primary">{{ n.category }}</span><h5 class="mt-2">{{ n.title }}</h5><p>{{ n.body }}</p>{% if n.link %}<a href="{{ n.link }}" target="_blank" rel="noopener noreferrer">Open official link ↗</a>{% endif %}<small class="text-muted">{{ n.created_at.strftime('%d %b %Y') }}</small></div>{% else %}<p>No notices yet.</p>{% endfor %}{% endblock %}
