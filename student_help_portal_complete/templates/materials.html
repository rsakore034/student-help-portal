{% extends "base.html" %}{% block content %}<h2>Study Materials</h2><div class="row g-3">{% for m in materials %}<div class="col-md-6 col-lg-4"><div class="card p-3 h-100"><h5>{{ m.title }}</h5><p>{{ m.description }}</p><small class="text-muted mb-3">{{ m.filename }} · {{ m.created_at.strftime('%d %b %Y') }}</small><a class="btn btn-outline-primary mt-auto" href="{{ url_for('download_material',item_id=m.id) }}">Download file</a></div></div>{% else %}<p>No materials available.</p>{% endfor %}</div>{% endblock %}
